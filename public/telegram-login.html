<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telegram bilan kirish</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, system-ui, sans-serif; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(168deg, #F3F0FF 0%, #FBFAFE 55%, #EBF6FF 100%);
      color: #1E1B4B; gap: 20px; padding: 24px; text-align: center;
    }
    h1 { font-size: 20px; font-weight: 800; margin: 0; }
    p { font-size: 14px; color: #6E698C; margin: 0; max-width: 320px; }
    #status { font-size: 13px; color: #8B86A6; min-height: 18px; }
    .err { color: #DC2626 !important; }
  </style>
</head>
<body>
  <h1>Telegram bilan kirish</h1>
  <p>Davom etish uchun Telegram hisobingizni tasdiqlang.</p>

  <!-- BOT_USERNAME'ni o'zingizning bot username'ingiz bilan almashtiring (@'siz). -->
  <script async
    src="https://telegram.org/js/telegram-widget.js?22"
    data-telegram-login="BOT_USERNAME"
    data-size="large"
    data-onauth="onTelegramAuth(user)"
    data-request-access="write"></script>

  <div id="status"></div>

  <script>
    function getRedirectUri() {
      const p = new URLSearchParams(window.location.search);
      return p.get("redirect_uri") || "elonuz://telegram";
    }

    async function onTelegramAuth(user) {
      const status = document.getElementById("status");
      status.textContent = "Tekshirilmoqda...";
      try {
        // Hosting rewrite orqali Cloud Function'ga (same-origin)
        const resp = await fetch("/api/telegramAuth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        });
        const json = await resp.json();
        if (!resp.ok || !json.token) {
          throw new Error(json.error || "Token olinmadi");
        }
        // Custom token bilan ilovaga qaytamiz
        const redirect = getRedirectUri();
        window.location.href = redirect + "?token=" + encodeURIComponent(json.token);
      } catch (e) {
        status.textContent = e.message || "Xatolik";
        status.classList.add("err");
      }
    }
  </script>
</body>
</html>
