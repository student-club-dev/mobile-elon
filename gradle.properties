# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Gradle JVM: JDK 21 (Temurin LTS) — AGP 8.13+ minimum. JDK 24 hali qo'llab-quvvatlanmaydi
# (Gradle 8.13 max Java 23). Bytecode target 17 bo'lib qoladi — build-logic'ga qarang.
org.gradle.java.home=/Users/quvonchbek/Library/Java/JavaVirtualMachines/temurin-21.0.11/Contents/Home
# JDK'lar ~/Library/Java/... da (IDE boshqaradi) — Gradle bu joyni o'zi topmaydi,
# shuning uchun daemon JVM kriteriyasi uchun qo'lda ko'rsatamiz.
org.gradle.java.installations.paths=/Users/quvonchbek/Library/Java/JavaVirtualMachines/temurin-21.0.11/Contents/Home,/Users/quvonchbek/Library/Java/JavaVirtualMachines/temurin-17.0.16-1/Contents/Home

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# Compose Multiplatform
org.jetbrains.compose.experimental.uikit.enabled=true
