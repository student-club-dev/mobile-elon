# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Use JDK 17 (Temurin) for Gradle — KMP/AGP do not support JDK 24 yet
org.gradle.java.home=/Users/quvonchbek/Library/Java/JavaVirtualMachines/temurin-17.0.16-1/Contents/Home

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# Compose Multiplatform
org.jetbrains.compose.experimental.uikit.enabled=true
